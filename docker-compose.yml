version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-orbit-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_password
      POSTGRES_DB: studio_orbit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d studio_orbit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: studio-orbit-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
